# Page Sharer — keep only LinkedIn (overrides the theme default)
# Documentation: https://docs.hugoblox.com/reference/page-sharer/

[[buttons]]
  id = "linkedin"
  url = "https://www.linkedin.com/shareArticle?url={url}&title={title}"
  title = "LinkedIn"
  icon_pack = "fab"
  icon = "linkedin-in"
  enable = true
